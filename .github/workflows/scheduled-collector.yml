name: Scheduled Official Source Ingestion

on:
  schedule:
    # Run every 4 hours (at minute 15 to avoid top-of-hour contention)
    - cron: '15 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  run-collector:
    name: Run Polite Source Ingestion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Validate Required Secrets
        run: |
          if [ -z "${{ secrets.SPRING_DATASOURCE_PASSWORD }}" ]; then
            echo "::error::GitHub Secret SPRING_DATASOURCE_PASSWORD is not configured. Please add it under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Execute Source Collector
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          COLLECTOR_USER_AGENT: "ExamRadarBot/1.0 (+https://examradar.in/bot; bot@examradar.in)"
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          cd services/backend
          mvn clean compile exec:java -Dexec.mainClass="com.examradar.backend.collector.CollectorCliRunner" -Dexec.args="--all"
