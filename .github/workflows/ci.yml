name: ExamRadar CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend & Ingestion Tests
    runs-on: ubuntu-latest
    env:
      # CI uses a dedicated test-only H2 in-memory DB — no real credentials needed
      DB_PASSWORD: ci-test-password-not-real
      SUPABASE_JWT_SECRET: ci-test-jwt-secret-placeholder-minimum-256-bits-for-tests
      ADMIN_API_KEY: ci-test-admin-key-placeholder-minimum-32-chars-ok
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Test Backend with Maven
        run: |
          cd services/backend
          mvn clean test

  android-verify:
    name: Android Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ "${#GOOGLE_SERVICES_JSON}" -gt 20 ]; then
            echo "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          else
            cat << 'EOF' > apps/android/app/google-services.json
          {
            "project_info": {
              "project_number": "245096169525",
              "project_id": "examradar-8f2e0",
              "storage_bucket": "examradar-8f2e0.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:245096169525:android:1f43a631d32630ed10317c",
                  "android_client_info": {
                    "package_name": "in.examradar.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDX7U1p5VNia6eOcmiYA6SD0u3TsMt3SJU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Inject local.properties (Supabase keys for CI build)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > apps/android/local.properties << EOF
          sdk.dir=$ANDROID_SDK_ROOT
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Run Android Lint and Unit Tests
        run: |
          cd apps/android
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lint

  android-release-build:
    name: Android Release AAB Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: android-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ "${#GOOGLE_SERVICES_JSON}" -gt 20 ]; then
            echo "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          else
            cat << 'EOF' > apps/android/app/google-services.json
          {
            "project_info": {
              "project_number": "245096169525",
              "project_id": "examradar-8f2e0",
              "storage_bucket": "examradar-8f2e0.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:245096169525:android:1f43a631d32630ed10317c",
                  "android_client_info": {
                    "package_name": "in.examradar.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDX7U1p5VNia6eOcmiYA6SD0u3TsMt3SJU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Decode & write release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/examradar-release.jks

      - name: Inject local.properties (signing + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > apps/android/local.properties << EOF
          sdk.dir=$ANDROID_SDK_ROOT
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          RELEASE_STORE_FILE=/tmp/examradar-release.jks
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build signed Release AAB
        run: |
          cd apps/android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: examradar-release-aab
          path: apps/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
