spring.application.name=examradar-backend
server.port=${SERVER_PORT:8085}

# Database Configuration — credentials MUST be set via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.qcdbjbattatozsuhwfyf}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings (Optimized for Supabase Transaction Pooler)
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase Auth & JWT — SUPABASE_JWT_SECRET MUST be set; no fallback allowed
examradar.security.jwt.secret=${SUPABASE_JWT_SECRET}
examradar.security.admin-api-key=${ADMIN_API_KEY}

# Collector Defaults
examradar.collector.user-agent=${COLLECTOR_USER_AGENT:ExamRadarBot/1.0 (+https://examradar.in/bot; bot@examradar.in)}
examradar.collector.timeout-ms=${COLLECTOR_TIMEOUT_MS:15000}
examradar.collector.rate-limit-delay-ms=${COLLECTOR_RATE_LIMIT_DELAY_MS:2000}

# Actuator Hardening & Docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Firebase Cloud Messaging
examradar.fcm.credentials-path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
