spring.application.name=examradar-backend
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.qcdbjbattatozsuhwfyf
