services:
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: examradar-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8085}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
