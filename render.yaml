services:
  - type: web
    name: examradar-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    dockerContext: ./services/backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: COLLECTOR_AUTO_SCRAPE_ENABLED
        value: "false"

